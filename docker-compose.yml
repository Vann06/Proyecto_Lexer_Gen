services:

  # Servidor Rust — expone el pipeline LR(1) en :8080
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped

  # UI estática — sirve el panel semántico (frontend/IDE-lite) en :4000 para
  # probar tokens/árbol/tabla de símbolos/tipos/errores semánticos con vistas
  # limpias. El IDE completo (stepper LR, DFA, codegen) sigue archivado y
  # documentado en frontend/IDE-full/ — ver su README para levantarlo aparte.
  frontend:
    build:
      context: ./frontend/IDE-lite
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - api
    restart: unless-stopped
