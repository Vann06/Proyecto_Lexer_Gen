services:

  # Servidor Rust — expone el pipeline LR(1) en :8080
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped

  # UI estática — sirve el IDE (frontend/IDE-lite) en :4000: tokens, árbol,
  # tabla de símbolos, tipos y problemas del pipeline.
  frontend:
    build:
      context: ./frontend/IDE-lite
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - api
    restart: unless-stopped
