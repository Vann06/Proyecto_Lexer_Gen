services:

  # API del DBMS (FastAPI + ANTLR) en :8080
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DBMS_DATA: /app/data
    volumes:
      - ./workspace:/app/workspace
      # Las bases de datos (metadata.txt, .csv, .idx) sobreviven a reiniciar
      # o recrear el contenedor.
      - ./data:/app/data
    restart: unless-stopped

  # UI estática: sirve el IDE (frontend/IDE-lite) en :4000: editor SQL,
  # tokens, árbol sintáctico, AST, problemas, resultados y catálogo.
  frontend:
    build:
      context: ./frontend/IDE-lite
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    depends_on:
      - api
    restart: unless-stopped
