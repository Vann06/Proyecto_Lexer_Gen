name: CI

# Corre en cada push directo a main y en cada pull request cuyo destino sea
# main (el filtro `branches` de `pull_request` mira la rama BASE del PR).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      # El parser generado está versionado; si alguien cambió SQL.g4 sin
      # regenerarlo, esto lo detecta en vez de probar un parser viejo.
      - name: Parser generado al día
        run: |
          yes | sh ../scripts/gen_parser.sh
          git diff --exit-code -- dbms/parser

      - name: Tests
        run: python -m pytest -q
