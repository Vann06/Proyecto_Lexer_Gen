name: CI

# Corre en cada push a SQL (el intérprete), a las ramas de trabajo SQL-* y a
# main, y en cada pull request cuyo destino sea SQL o main (el filtro
# `branches` de `pull_request` mira la rama BASE del PR).
on:
  push:
    branches: [SQL, "SQL-*", main]
  pull_request:
    branches: [SQL, main]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      # El parser generado está versionado; si alguien cambió SQL.g4 sin
      # regenerarlo, esto lo detecta en vez de probar un parser viejo.
      - name: Parser generado al día
        run: |
          yes | sh ../scripts/gen_parser.sh
          git diff --exit-code -- dbms/parser

      # Un test por requisito del enunciado: si algo se rompe, el nombre del
      # test que falla dice qué requisito fue.
      - name: Rúbrica del enunciado
        run: python -m pytest tests/test_rubrica.py -v

      - name: Suite completa
        run: python -m pytest -q
